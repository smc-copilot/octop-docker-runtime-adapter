# V2 managed user-scope adapter; preserves ExecStart, sg docker and user service.
[Service]
Environment="PYTHONPATH=/data/octop-docker-runtime-adapter"
Environment="OCTOP_DRA_ENABLED=1"
Environment="OCTOP_DRA_CONFIG=/data/octop-docker-runtime-adapter/config/adapter.json"
Environment="OCTOP_DRA_PIN_EXISTING=1"
UnsetEnvironment=OCTOP_IN_CONTAINER
